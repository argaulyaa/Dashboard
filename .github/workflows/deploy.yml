name: Build & Deploy to K8s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/argaulyaa/openran-dashboard-backend
  FRONTEND_IMAGE: ghcr.io/argaulyaa/openran-dashboard-frontend
  # MUST stay identical to the existing Helm release that serves the site (deployments
  # oran-backend/oran-frontend, NodePort 30090). Using any other name creates a duplicate,
  # conflicting release while the real one never updates. Do not rename.
  HELM_RELEASE: oran
  NAMESPACE: dashboard

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ghcr.io is a private registry. The chart references the `ghcr-secret`
      # dockerconfig secret via image.imagePullSecrets (see values.yaml) so the kubelet can
      # pull the freshly-built images. This step ensures it exists; it is idempotent and
      # keeps a pre-existing (working) secret on an established cluster.
      # For a FRESH cluster, set GHCR_TOKEN (PAT with `read:packages`) and optionally
      # GHCR_USERNAME as Actions secrets — GITHUB_TOKEN is only a fallback.
      - name: Ensure ghcr.io pull secret
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl get secret ghcr-secret -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
            kubectl create secret docker-registry ghcr-secret -n ${{ env.NAMESPACE }} \
              --docker-server=${{ env.REGISTRY }} \
              --docker-username=${{ secrets.GHCR_USERNAME || github.actor }} \
              --docker-password=${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy to K8s via Helm
        run: |
          # Image tag is pinned to the SHA just pushed (unique per build) and
          # imagePullPolicy=Always, so every push deploys exactly the new build —
          # no stale-image mismatch. Values/SSH creds/secret live in the chart so a
          # plain upgrade renders the known-good state without --reuse-values.
          helm upgrade --install ${{ env.HELM_RELEASE }} ./deploy/helm/oran-dashboard \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --timeout 180s \
            --wait
          kubectl get pods -n ${{ env.NAMESPACE }}
