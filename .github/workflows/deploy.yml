name: Build & Deploy to K8s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/argaulyaa/openran-dashboard-backend
  FRONTEND_IMAGE: ghcr.io/argaulyaa/openran-dashboard-frontend
  HELM_RELEASE: oran-dashboard
  NAMESPACE: dashboard

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to K8s via Helm
        run: |
          # Hapus service lama dari deployment manual (kalau ada) supaya tidak
          # konflik port dengan service yang dibuat Helm.
          kubectl delete service oran-dashboard-frontend oran-dashboard-backend \
            -n ${{ env.NAMESPACE }} --ignore-not-found=true

          helm upgrade --install ${{ env.HELM_RELEASE }} ./deploy/helm/oran-dashboard \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --reuse-values \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --timeout 120s \
            --wait
          kubectl get pods -n ${{ env.NAMESPACE }}