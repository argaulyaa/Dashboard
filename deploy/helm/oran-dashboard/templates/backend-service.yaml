apiVersion: v1
kind: Service
metadata:
  name: {{ include "oran-dashboard.backend" . }}
  labels:
    {{- include "oran-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "oran-dashboard.fullname" . }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
