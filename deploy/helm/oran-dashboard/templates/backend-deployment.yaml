apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oran-dashboard.fullname" . }}-backend
  labels:
    {{- include "oran-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oran-dashboard.fullname" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oran-dashboard.fullname" . }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- if or .Values.backend.oai.sshHost .Values.backend.ran.sshHost }}
            - configMapRef:
                name: {{ include "oran-dashboard.fullname" . }}-backend
            {{- end }}
            - secretRef:
                name: {{ include "oran-dashboard.fullname" . }}-backend
          {{- range $k, $v := .Values.backend.extraEnv }}
          env:
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "oran-dashboard.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
