apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oran-dashboard.fullname" . }}-backend
  labels:
    {{- include "oran-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  ORAN_USERS: {{ .Values.auth.oranUsers | quote }}
  OAI_SSH_PASSWORD: {{ .Values.backend.oai.sshPassword | quote }}
  {{- if .Values.backend.ran.sshHost }}
  OAI_SSH_RAN_PASSWORD: {{ .Values.backend.ran.sshPassword | quote }}
  {{- end }}
  {{- /*
    SMTP credentials for verification-email OTP. Defaults are empty in
    values.yaml so this file stays safe for git; real values are injected at
    deploy time via `helm --set smtp.*` or `kubectl edit secret`. See the
    smtp block comment in values.yaml.
  */}}
  SMTP_HOST: {{ (.Values.smtp).host | default "" | quote }}
  SMTP_PORT: {{ (.Values.smtp).port | default "587" | quote }}
  SMTP_USER: {{ (.Values.smtp).user | default "" | quote }}
  SMTP_PASSWORD: {{ (.Values.smtp).password | default "" | quote }}
  SMTP_FROM: {{ (.Values.smtp).from | default "" | quote }}
