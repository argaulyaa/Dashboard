{{- if or .Values.backend.oai.sshHost .Values.backend.ran.sshHost .Values.backend.k8s.sshHost .Values.backend.open5gs.sshHost .Values.backend.ric.sshHost .Values.backend.ric.k8sSshHost .Values.backend.ric.k8s.sshHost }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oran-dashboard.fullname" . }}-backend
  labels:
    {{- include "oran-dashboard.labels" . | nindent 4 }}
data:
  OAI_CORE_CONTAINERS: {{ .Values.backend.oai.containers | quote }}
  OAI_SSH_HOST: {{ .Values.backend.oai.sshHost | quote }}
  OAI_SSH_PORT: {{ .Values.backend.oai.sshPort | quote }}
  OAI_SSH_USER: {{ .Values.backend.oai.sshUser | quote }}
  {{- if .Values.backend.ran.sshHost }}
  OAI_SSH_RAN_HOST: {{ .Values.backend.ran.sshHost | quote }}
  OAI_SSH_RAN_PORT: {{ .Values.backend.ran.sshPort | quote }}
  OAI_SSH_RAN_USER: {{ .Values.backend.ran.sshUser | quote }}
  SRSRAN_SSH_HOST: {{ .Values.backend.ran.sshHost | quote }}
  SRSRAN_SSH_PORT: {{ .Values.backend.ran.sshPort | quote }}
  SRSRAN_SSH_USER: {{ .Values.backend.ran.sshUser | quote }}
  {{- end }}
  {{- if .Values.backend.k8s.sshHost }}
  OAI_K8S_SSH_HOST: {{ .Values.backend.k8s.sshHost | quote }}
  OAI_K8S_SSH_PORT: {{ .Values.backend.k8s.sshPort | quote }}
  OAI_K8S_SSH_USER: {{ .Values.backend.k8s.sshUser | quote }}
  OAI_K8S_NAMESPACE: {{ .Values.backend.k8s.namespace | quote }}
  OAI_K8S_ADMIN_CONF: {{ .Values.backend.k8s.kubeconfig | quote }}
  {{- end }}
  {{- if .Values.backend.open5gs.sshHost }}
  OPEN5GS_K8S_SSH_HOST: {{ .Values.backend.open5gs.sshHost | quote }}
  OPEN5GS_K8S_SSH_PORT: {{ .Values.backend.open5gs.sshPort | quote }}
  OPEN5GS_K8S_SSH_USER: {{ .Values.backend.open5gs.sshUser | quote }}
  OPEN5GS_K8S_NAMESPACE: {{ .Values.backend.open5gs.namespace | quote }}
  OPEN5GS_K8S_ADMIN_CONF: {{ .Values.backend.open5gs.kubeconfig | quote }}
  {{- end }}
  {{- if .Values.backend.ric.sshHost }}
  RIC_SSH_HOST: {{ .Values.backend.ric.sshHost | quote }}
  RIC_SSH_PORT: {{ .Values.backend.ric.sshPort | quote }}
  RIC_SSH_USER: {{ .Values.backend.ric.sshUser | quote }}
  {{- end }}
  {{- if or .Values.backend.ric.k8s.sshHost .Values.backend.ric.k8sSshHost }}
  RIC_K8S_SSH_HOST: {{ coalesce .Values.backend.ric.k8s.sshHost .Values.backend.ric.k8sSshHost | quote }}
  RIC_K8S_SSH_PORT: {{ coalesce .Values.backend.ric.k8s.sshPort .Values.backend.ric.k8sSshPort | quote }}
  RIC_K8S_SSH_USER: {{ coalesce .Values.backend.ric.k8s.sshUser .Values.backend.ric.k8sSshUser | quote }}
  RIC_K8S_NAMESPACE: {{ coalesce .Values.backend.ric.k8s.namespace .Values.backend.ric.k8sNamespace | quote }}
  RIC_K8S_ADMIN_CONF: {{ coalesce .Values.backend.ric.k8s.kubeconfig .Values.backend.ric.k8sKubeconfig | quote }}
  {{- end }}
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
