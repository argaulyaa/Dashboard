# Default values for oran-dashboard.
# Helm chart for the O-RAN Control Dashboard. Docs: deploy/README.md

# ---- Images ----
image:
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-secret

backend:
  replicas: 1
  image:
    repository: ghcr.io/argaulyaa/openran-dashboard-backend
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  nodeSelector:
    kubernetes.io/hostname: core
  tolerations: []
  affinity: {}
  extraEnv: {}
  oai:
    sshHost: "10.91.2.151"
    sshPort: "22"
    sshUser: "core"
    sshPassword: "telmat123"
    containers: '{"amf":"oai-amf","smf":"oai-smf","upf":"oai-upf","nrf":"oai-nrf","ausf":"oai-ausf","udm":"oai-udm","udr":"oai-udr","mysql":"mysql","ext-dn":"oai-ext-dn"}'
  ran:
    sshHost: "10.91.2.152"
    sshPort: "22"
    sshUser: "ran"
    sshPassword: "telmat123"
  k8s:
    sshHost: ""
    sshPort: "22"
    sshUser: ""
    sshPassword: ""
    sudoPassword: ""
    namespace: "5g-core"
    kubeconfig: "/etc/kubernetes/admin.conf"
  open5gs:
    sshHost: ""
    sshPort: "22"
    sshUser: ""
    sshPassword: ""
    sudoPassword: ""
    namespace: "open5gs-chart"
    kubeconfig: "/etc/kubernetes/admin.conf"

auth:
  oranUsers: "admin:admin"

smtp:
  host: ''
  port: '587'
  user: ''
  password: ''
  from: ''

database:
  url: "sqlite:////data/oran_dashboard.db"

persistence:
  enabled: true
  size: 1Gi
  storageClass: "nfs-open5gs"

frontend:
  replicas: 1
  image:
    repository: ghcr.io/argaulyaa/openran-dashboard-frontend
    tag: latest
  nodeSelector:
    kubernetes.io/hostname: core
  serviceType: NodePort
  nodePort: 30090
  ingress:
    enabled: false
    className: ""
    host: dashboard.local
